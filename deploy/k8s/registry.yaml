apiVersion: apps/v1
kind: Deployment
metadata:
  name: triverse-registry
  namespace: triverse-agent
  labels:
    app: triverse-registry
spec:
  replicas: 1
  selector:
    matchLabels:
      app: triverse-registry
  template:
    metadata:
      labels:
        app: triverse-registry
    spec:
      # 调度在 master03。不修改任何节点的 containerd 配置。
      nodeSelector:
        kubernetes.io/hostname: master03
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: registry
          image: docker.1ms.run/library/registry:2
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
          readinessProbe:
            tcpSocket:
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/lib/registry
      volumes:
        - name: data
          hostPath:
            path: /mnt/jfs-ssd/liweiyu/triverse_agent/registry
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: triverse-registry
  namespace: triverse-agent
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: triverse-registry
  ports:
    - name: http
      port: 5000
      targetPort: http
      nodePort: 30500
