# 模型推理凭据。Triverse 业务工具通过 MCP 登录，不需要 API Secret。
# 复制成 secrets.yaml 后替换。不要把 secrets.yaml 提交进 git。
apiVersion: v1
kind: Secret
metadata:
  name: openhands-llm
  namespace: triverse-agent
type: Opaque
stringData:
  apiKey: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: session-api
  namespace: triverse-agent
type: Opaque
stringData:
  sessionApiKey: REPLACE_ME

---
apiVersion: v1
kind: Secret
metadata:
  name: triverse-workspace-access
  namespace: triverse-agent
type: Opaque
stringData:
  token: REPLACE_WITH_A_LONG_RANDOM_ACCESS_KEY
