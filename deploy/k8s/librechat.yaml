# LibreChat v0.8.8. Chat, accounts, roles, and groups.
# Same namespace, node, and Teamo gateway as OpenHands Canvas.
# No privileged mode, no docker.sock, no hostNetwork.
# Secret librechat-credentials is created on the cluster and is not in git.
# It holds TEAMO_API_KEY, JWT_SECRET, JWT_REFRESH_SECRET, CREDS_KEY, CREDS_IV,
# and MEILI_MASTER_KEY. TEAMO_API_KEY is a copy of openhands-llm/apiKey.
# RAG, the admin panel, and pgvector are not deployed. File search stays off.
apiVersion: v1
kind: ConfigMap
metadata:
  name: librechat-config
  namespace: triverse-agent
data:
  librechat.yaml: |
    version: 1.3.17
    cache: true
    interface:
      customWelcome: "Triverse LibreChat。对话走 Teamo，默认模型是 Claude Haiku 5.5。第一个注册的账号是管理员。"
      fileSearch: false
      modelSelect: true
      parameters: true
      presets: true
      prompts:
        use: true
        create: true
        share: false
        public: false
      bookmarks: true
      multiConvo: true
      agents:
        use: true
        create: true
        share: false
        public: false
      peoplePicker:
        users: true
        groups: true
        roles: true
      marketplace:
        use: false
      fileCitations: false
    registration:
      socialLogins: []
    modelSpecs:
      enforce: false
      prioritize: true
      list:
        - name: claude-haiku-5-5
          label: Claude Haiku 5.5
          default: true
          description: 默认对话模型
          preset:
            endpoint: Teamo
            model: claude-haiku-5-5
        - name: gpt-6-astra
          label: GPT-6 Astra
          preset:
            endpoint: Teamo
            model: gpt-6-astra
        - name: gpt-6-sol
          label: GPT-6 Sol
          preset:
            endpoint: Teamo
            model: gpt-6-sol
        - name: claude-opus-5-5
          label: Claude Opus 5.5
          preset:
            endpoint: Teamo
            model: claude-opus-5-5
        - name: claude-sonnet-5-5
          label: Claude Sonnet 5.5
          preset:
            endpoint: Teamo
            model: claude-sonnet-5-5
        - name: deepseek-flash
          label: DeepSeek 4.1 Flash
          preset:
            endpoint: Teamo
            model: deepseek-flash
        - name: glm-5.3-flash
          label: GLM 5.3 Flash
          preset:
            endpoint: Teamo
            model: glm-5.3-flash
    endpoints:
      custom:
        - name: Teamo
          apiKey: "${TEAMO_API_KEY}"
          baseURL: "https://api.teamorouter.cn/v1"
          models:
            default:
              - claude-haiku-5-5
              - gpt-6-astra
              - gpt-6-sol
              - claude-opus-5-5
              - claude-sonnet-5-5
              - deepseek-flash
              - glm-5.3-flash
            fetch: false
          titleConvo: true
          titleModel: claude-haiku-5-5
          dropParams:
            - stop
          modelDisplayLabel: Teamo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-mongo
  namespace: triverse-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: librechat-mongo
  template:
    metadata:
      labels:
        app: librechat-mongo
    spec:
      nodeSelector:
        kubernetes.io/hostname: master03
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: mongo
          image: docker.1ms.run/library/mongo:8.0.20
          imagePullPolicy: IfNotPresent
          args: ["mongod", "--bind_ip_all", "--noauth"]
          ports:
            - name: mongo
              containerPort: 27017
          readinessProbe:
            tcpSocket:
              port: mongo
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: mongo
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 100m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          hostPath:
            path: /mnt/jfs-ssd/liweiyu/triverse_agent/librechat/mongo
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: librechat-mongo
  namespace: triverse-agent
spec:
  selector:
    app: librechat-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: mongo
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat-meili
  namespace: triverse-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: librechat-meili
  template:
    metadata:
      labels:
        app: librechat-meili
    spec:
      nodeSelector:
        kubernetes.io/hostname: master03
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: meili
          image: docker.1ms.run/getmeili/meilisearch:v1.35.1
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 7700
          env:
            - name: MEILI_ENV
              value: production
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: MEILI_HTTP_ADDR
              value: 0.0.0.0:7700
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-credentials
                  key: MEILI_MASTER_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /meili_data
      volumes:
        - name: data
          hostPath:
            path: /mnt/jfs-ssd/liweiyu/triverse_agent/librechat/meili
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: librechat-meili
  namespace: triverse-agent
spec:
  selector:
    app: librechat-meili
  ports:
    - name: http
      port: 7700
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: librechat
  namespace: triverse-agent
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: librechat
  template:
    metadata:
      labels:
        app: librechat
    spec:
      nodeSelector:
        kubernetes.io/hostname: master03
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: librechat
          # v0.8.8 all-in-one image. Same bytes as ghcr.io/librechat-ai/librechat:v0.8.8.
          # master03 uses the ghcr.nju.edu.cn mirror.
          image: ghcr.nju.edu.cn/librechat-ai/librechat:v0.8.8
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3080
          env:
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: "3080"
            - name: NODE_ENV
              value: production
            - name: TRUST_PROXY
              value: "0"
            - name: NO_INDEX
              value: "true"
            - name: CONFIG_PATH
              value: /app/librechat.yaml
            - name: DOMAIN_CLIENT
              value: http://10.15.127.211:30863
            - name: DOMAIN_SERVER
              value: http://10.15.127.211:30863
            # NodePort is plain HTTP. A Secure cookie would be dropped by the browser.
            - name: SESSION_COOKIE_SECURE
              value: "false"
            - name: MONGO_URI
              value: mongodb://librechat-mongo:27017/LibreChat
            - name: SEARCH
              value: "true"
            - name: MEILI_HOST
              value: http://librechat-meili:7700
            - name: MEILI_NO_ANALYTICS
              value: "true"
            - name: APP_TITLE
              value: LibreChat
            - name: ALLOW_REGISTRATION
              value: "true"
            - name: ALLOW_EMAIL_LOGIN
              value: "true"
            - name: ALLOW_SOCIAL_LOGIN
              value: "false"
            - name: ALLOW_SOCIAL_REGISTRATION
              value: "false"
            - name: ALLOW_PASSWORD_RESET
              value: "false"
            - name: ALLOW_UNVERIFIED_EMAIL_LOGIN
              value: "true"
            - name: ALLOW_PASSKEY_LOGIN
              value: "false"
            - name: LOG_TO_FILE
              value: "false"
            - name: DEBUG_LOGGING
              value: "false"
            - name: CONSOLE_LOG_LEVEL
              value: info
            - name: NODE_OPTIONS
              value: --max-old-space-size=2048
            - name: TEAMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-credentials
                  key: TEAMO_API_KEY
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-credentials
                  key: JWT_SECRET
            - name: JWT_REFRESH_SECRET
              valueFrom:
                secretKeyRef:
                  name: librechat-credentials
                  key: JWT_REFRESH_SECRET
            - name: CREDS_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-credentials
                  key: CREDS_KEY
            - name: CREDS_IV
              valueFrom:
                secretKeyRef:
                  name: librechat-credentials
                  key: CREDS_IV
            - name: MEILI_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: librechat-credentials
                  key: MEILI_MASTER_KEY
          volumeMounts:
            - name: config
              mountPath: /app/librechat.yaml
              subPath: librechat.yaml
              readOnly: true
            - name: images
              mountPath: /app/client/public/images
            - name: uploads
              mountPath: /app/uploads
            - name: data
              mountPath: /app/data
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
      volumes:
        - name: config
          configMap:
            name: librechat-config
        - name: images
          hostPath:
            path: /mnt/jfs-ssd/liweiyu/triverse_agent/librechat/images
            type: DirectoryOrCreate
        - name: uploads
          hostPath:
            path: /mnt/jfs-ssd/liweiyu/triverse_agent/librechat/uploads
            type: DirectoryOrCreate
        - name: data
          hostPath:
            path: /mnt/jfs-ssd/liweiyu/triverse_agent/librechat/data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: librechat
  namespace: triverse-agent
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: librechat
  ports:
    - name: http
      port: 3080
      targetPort: http
      nodePort: 30863
