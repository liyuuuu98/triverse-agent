# 与 deploy/k8s/namespace.yaml 相同。命名空间 triverse-agent 已经存在。
apiVersion: v1
kind: Namespace
metadata:
  name: triverse-agent
---
# 只创建 Deployment / Service triverse-pi。
# 本机没有 Docker，master03 不构建镜像。进程读 hostPath 上已构建的目录。
# deploy/pi/Dockerfile 是以后的镜像，不是这个 Pod 在跑的镜像。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: triverse-pi
  namespace: triverse-agent
  labels:
    app: triverse-pi
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: triverse-pi
  template:
    metadata:
      labels:
        app: triverse-pi
    spec:
      hostNetwork: false
      nodeSelector:
        kubernetes.io/hostname: master03
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      # JuiceFS hostPath 不会变成非特权 uid 可写。fsGroup 修不好。不是 privileged。
      securityContext:
        runAsUser: 0
        runAsGroup: 0
      containers:
        - name: triverse-pi
          image: docker.1ms.run/library/node:22-bookworm
          imagePullPolicy: IfNotPresent
          workingDir: /opt/triverse
          command: ["node", "/opt/triverse/apps/gateway/dist/server.js"]
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: DATA_DIR
              value: /data
            - name: WEB_DIST
              value: /opt/triverse/apps/web/dist
            - name: SKILLS_DIR
              value: /opt/triverse/skills
            - name: TEAMO_BASE_URL
              value: https://api.teamorouter.cn/v1
            - name: TRIVERSE_MCP_URL
              value: https://dev-mcp.triverse.ai/mcp
            # Shell is disabled when the image has no working OS sandbox.
            - name: HOST
              value: 0.0.0.0
            - name: WORKSPACE_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: triverse-workspace-access
                  key: token
            - name: PI_CODING_AGENT_DIR
              value: /data/.pi
            - name: MCP_CALLBACK_HOST
              value: 0.0.0.0
            - name: MCP_CALLBACK_PORT
              value: "8791"
            - name: TEAMO_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openhands-llm
                  key: apiKey
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 4Gi
          volumeMounts:
            - name: app
              mountPath: /opt/triverse
              readOnly: true
            - name: data
              mountPath: /data
      volumes:
        - name: app
          hostPath:
            path: /mnt/jfs-ssd/liweiyu/triverse_agent/pi-app
            type: Directory
        - name: data
          hostPath:
            path: /mnt/jfs-ssd/liweiyu/triverse_agent/pi-data
            type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: triverse-pi
  namespace: triverse-agent
  labels:
    app: triverse-pi
spec:
  type: NodePort
  selector:
    app: triverse-pi
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30864
